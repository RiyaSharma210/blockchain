<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockTrace</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">

        <h1>BlockTrace</h1>

        <p>
            Fake Product Detection Using Blockchain
        </p>

        <form action="/add_product" method="POST">

            <input
                type="text"
                name="product_name"
                placeholder="Enter Product Name"
                required
            >

            <br><br>

            <input
                type="text"
                name="manufacturer"
                placeholder="Enter Manufacturer Name"
                required
            >

            <br><br>

            <button type="submit">
                Add Product
            </button>

        </form>

        <br><br>

        <a href="/verify">
            <button>
                Go To Verification
            </button>
        </a>

    </div>

</body>
</html>
