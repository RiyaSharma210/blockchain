<!DOCTYPE html>
<html>
<head>

    <title>Verification Result</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

    {% if result %}

        <h1 style="color:green;">
            ✅ Genuine Product
        </h1>

        <h2>
            Product Name:
            {{ product_name }}
        </h2>

        <p>
            This product exists in blockchain records.
        </p>

    {% else %}

        <h1 style="color:red;">
            ❌ Fake Product
        </h1>

        <h2>
            Product Name:
            {{ product_name }}
        </h2>

        <p>
            Product not found in blockchain.
        </p>

    {% endif %}

    <br>

    <a href="/">
        <button>
            Back To Home
        </button>
    </a>

</div>

</body>
</html>
